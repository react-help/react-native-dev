name: Refresh data

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Never fails because a source is down: it keeps last-good data and logs warnings.
      - run: npm run fetch

      - run: npm test

      # Make sure the commit we're about to push still builds, so Netlify never gets a broken deploy.
      - run: npm run build

      - name: Commit releases.json if it changed
        run: |
          if git diff --quiet -- data/releases.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "data: refresh react native versions"
          git push
